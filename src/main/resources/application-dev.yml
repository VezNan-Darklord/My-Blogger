spring:
  datasource:
    url: jdbc:mysql://localhost:3306/csulzc_blogdb_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: YuanZiqi222+++
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true
  security:
    user:
      password: disabled

jwt:
  secret: my-personal-blog-secret-key-2026-must-be-changed-in-production-environment
  expiration: 86400000
  refresh-expiration: 604800000
  token-prefix: "Bearer "
  header: Authorization

file:
  upload-dir: uploads
  max-file-size: 5242880
  allowed-file-types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
  show-actuator: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
