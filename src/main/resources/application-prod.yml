  spring:
    datasource:
      url: jdbc:mysql://localhost:3306/csulzc_blogdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: root
      password: YuanZiqi222+++  # 修改为你的MySQL密码
    jpa:
      hibernate:
        ddl-auto: update  # 生产环境使用update，保留数据
      show-sql: false
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MySQLDialect
    servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 10MB
        enabled: true

  jwt:
    secret: my-personal-blog-secret-key-2026-must-be-changed-in-production-environment
    expiration: 86400000
    refresh-expiration: 604800000
    token-prefix: "Bearer "
    header: Authorization

  file:
    upload-dir: uploads
    max-file-size: 5242880
    allowed-file-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp

  logging:
    level:
      org.hibernate.SQL: INFO
      org.hibernate.type.descriptor.sql.BasicBinder: WARN
