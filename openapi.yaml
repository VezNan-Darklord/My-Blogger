components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "输入JWT Token（不含Bearer前缀，仅输入Token字符串）"

  schemas:
    # ==================== 公共通用 ====================
    Result:
      type: "object"
      properties:
        data:
          type: "object"
          nullable: true
        message:
          type: "string"
          example: "success"
        code:
          type: "integer"
          example: 200

    ApiResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        message:
          type: "string"
          example: "操作成功"
        data:
          type: "object"
          nullable: true
        errorCode:
          type: "string"
          nullable: true
        timestamp:
          type: "string"
          format: "date-time"

    BaseDTO:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"

    PageRequestDTO:
      type: "object"
      properties:
        page:
          type: "integer"
          format: "int32"
          minimum: 0
          default: 0
        size:
          type: "integer"
          format: "int32"
          minimum: 1
          maximum: 100
          default: 10
        sortBy:
          type: "string"
          pattern: "^[a-zA-Z0-9_\\-.]+$"
        sortDirection:
          type: "string"
          enum: [ "asc", "desc", "ASC", "DESC" ]

    PageResponseDTO_ArticleListItemDTO:
      type: "object"
      properties:
        content:
          type: "array"
          items:
            $ref: "#/components/schemas/ArticleListItemDTO"
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
        first:
          type: "boolean"
        last:
          type: "boolean"

    PageResponseDTO_CategoryDTO:
      type: "object"
      properties:
        content:
          type: "array"
          items:
            $ref: "#/components/schemas/CategoryDTO"
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
        first:
          type: "boolean"
        last:
          type: "boolean"

    PageResponseDTO_CommentDTO:
      type: "object"
      properties:
        content:
          type: "array"
          items:
            $ref: "#/components/schemas/CommentDTO"
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
        first:
          type: "boolean"
        last:
          type: "boolean"

    PageResponseDTO_CommentReplyDTO:
      type: "object"
      properties:
        content:
          type: "array"
          items:
            $ref: "#/components/schemas/CommentReplyDTO"
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
        first:
          type: "boolean"
        last:
          type: "boolean"

    PageResponseDTO_UserProfileDTO:
      type: "object"
      properties:
        content:
          type: "array"
          items:
            $ref: "#/components/schemas/UserProfileDTO"
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
        first:
          type: "boolean"
        last:
          type: "boolean"

    BatchIdRequest:
      type: "object"
      required: [ "ids" ]
      properties:
        ids:
          type: "array"
          items:
            type: "integer"
            format: "int64"
          description: "ID列表"

    FileUploadResponse:
      type: "object"
      properties:
        fileName:
          type: "string"
        fileUrl:
          type: "string"
        fileType:
          type: "string"
        fileSize:
          type: "integer"
          format: "int64"
        base64Data:
          type: "string"
          nullable: true
          description: "Base64编码数据（可选）"

    Base64UploadRequest:
      type: "object"
      required: [ "base64Data", "fileName" ]
      properties:
        base64Data:
          type: "string"
          description: "Base64数据"
        fileName:
          type: "string"
          maxLength: 255
          description: "文件名"

    # ==================== 用户模块 ====================
    UserRegisterRequest:
      type: "object"
      required: [ "username", "email", "password" ]
      properties:
        username:
          type: "string"
          minLength: 3
          maxLength: 20
          pattern: "^[a-zA-Z0-9_]+$"
          description: "用户名"
        email:
          type: "string"
          format: "email"
          description: "邮箱"
        password:
          type: "string"
          minLength: 6
          maxLength: 20
          description: "密码"
        displayName:
          type: "string"
          maxLength: 50
          description: "显示名称"

    UserLoginRequest:
      type: "object"
      required: [ "username", "password" ]
      properties:
        username:
          type: "string"
          description: "用户名/邮箱"
        password:
          type: "string"
          description: "密码"

    LoginResponseDTO:
      type: "object"
      properties:
        accessToken:
          type: "string"
        refreshToken:
          type: "string"
        tokenType:
          type: "string"
          default: "Bearer"
        expiresIn:
          type: "integer"
          format: "int64"
        user:
          $ref: "#/components/schemas/UserDetailDTO"

    UserDetailDTO:
      allOf:
        - $ref: "#/components/schemas/BaseDTO"
        - type: "object"
          properties:
            username:
              type: "string"
            email:
              type: "string"
            displayName:
              type: "string"
            avatar:
              type: "string"
            bio:
              type: "string"
            status:
              $ref: "#/components/schemas/UserStatusType"
            lastLoginAt:
              type: "string"
              format: "date-time"
            articleCount:
              type: "integer"
              format: "int64"
            commentCount:
              type: "integer"
              format: "int64"
            favoriteCount:
              type: "integer"
              format: "int64"

    UserProfileDTO:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        username:
          type: "string"
        displayName:
          type: "string"
        avatar:
          type: "string"
          description: "头像URL"
        bio:
          type: "string"
          description: "个人简介"
        createdAt:
          type: "string"
          format: "date-time"
        articleCount:
          type: "integer"
          format: "int64"
        commentCount:
          type: "integer"
          format: "int64"
        followerCount:
          type: "integer"
          format: "int64"

    UserUpdateRequest:
      type: "object"
      properties:
        displayName:
          type: "string"
          maxLength: 50
        bio:
          type: "string"
          maxLength: 200
        avatar:
          type: "string"

    UserPasswordChangeRequest:
      type: "object"
      required: [ "oldPassword", "newPassword" ]
      properties:
        oldPassword:
          type: "string"
          description: "原密码"
        newPassword:
          type: "string"
          minLength: 6
          maxLength: 20
          description: "新密码"

    UserActivityDTO:
      type: "object"
      properties:
        userId:
          type: "integer"
          format: "int64"
        username:
          type: "string"
        displayName:
          type: "string"
        articleCount:
          type: "integer"
          format: "int64"
        commentCount:
          type: "integer"
          format: "int64"
        likeReceived:
          type: "integer"
          format: "int64"
        lastActiveAt:
          type: "string"
          format: "date-time"

    UserStatusType:
      type: "string"
      enum: [ "ACTIVE", "INACTIVE", "LOCKED" ]

    # ==================== 文章模块 ====================
    ArticleStatusType:
      type: "string"
      enum: [ "DRAFT", "RELEASE", "ARCHIVE" ]

    ArticleCreateRequest:
      type: "object"
      required: [ "title", "content", "categoryIds" ]
      properties:
        title:
          type: "string"
          minLength: 5
          maxLength: 100
          description: "标题"
        content:
          type: "string"
          minLength: 20
          description: "内容（Markdown）"
        summary:
          type: "string"
          maxLength: 200
          description: "摘要"
        coverImage:
          type: "string"
          description: "封面图URL"
        categoryIds:
          type: "array"
          items:
            type: "integer"
            format: "int64"
          minItems: 1
          description: "分类ID集合"
        status:
          $ref: "#/components/schemas/ArticleStatusType"
          default: "DRAFT"
        tags:
          type: "array"
          items:
            type: "string"
          description: "标签"

    ArticleUpdateRequest:
      type: "object"
      properties:
        title:
          type: "string"
          minLength: 5
          maxLength: 100
        content:
          type: "string"
          minLength: 20
        summary:
          type: "string"
          maxLength: 200
        coverImage:
          type: "string"
        categoryIds:
          type: "array"
          items:
            type: "integer"
            format: "int64"
          minItems: 1
        status:
          $ref: "#/components/schemas/ArticleStatusType"
        tags:
          type: "array"
          items:
            type: "string"

    ArticleDetailDTO:
      allOf:
        - $ref: "#/components/schemas/BaseDTO"
        - type: "object"
          properties:
            title:
              type: "string"
            content:
              type: "string"
            summary:
              type: "string"
            coverImage:
              type: "string"
            author:
              $ref: "#/components/schemas/UserProfileDTO"
            categories:
              type: "array"
              items:
                $ref: "#/components/schemas/CategoryDTO"
            tags:
              type: "array"
              items:
                type: "string"
            status:
              $ref: "#/components/schemas/ArticleStatusType"
            likeCount:
              type: "integer"
              format: "int32"
            favoriteCount:
              type: "integer"
              format: "int32"
            commentCount:
              type: "integer"
              format: "int32"
            isLiked:
              type: "boolean"
              description: "当前用户是否点赞"
            isFavorite:
              type: "boolean"
              description: "当前用户是否收藏"

    ArticleListItemDTO:
      allOf:
        - $ref: "#/components/schemas/BaseDTO"
        - type: "object"
          properties:
            title:
              type: "string"
            summary:
              type: "string"
            coverImage:
              type: "string"
            author:
              $ref: "#/components/schemas/UserProfileDTO"
            categories:
              type: "array"
              items:
                $ref: "#/components/schemas/CategoryDTO"
            likeCount:
              type: "integer"
              format: "int32"
            commentCount:
              type: "integer"
              format: "int32"
            favoriteCount:
              type: "integer"
              format: "int32"

    # ==================== 分类模块 ====================
    CategoryRequest:
      type: "object"
      required: [ "name" ]
      properties:
        name:
          type: "string"
          minLength: 2
          maxLength: 20
          description: "分类名称"
        description:
          type: "string"
          description: "分类描述"
        parentCategoryId:
          type: "integer"
          format: "int64"
          description: "父分类ID"

    CategoryDTO:
      allOf:
        - $ref: "#/components/schemas/BaseDTO"
        - type: "object"
          properties:
            name:
              type: "string"
            description:
              type: "string"
            parentCategoryId:
              type: "integer"
              format: "int64"
              nullable: true
            parentCategoryName:
              type: "string"
            articleCount:
              type: "integer"
              format: "int32"
            subCategories:
              type: "array"
              items:
                $ref: "#/components/schemas/CategoryDTO"

    CategoryTreeDTO:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        description:
          type: "string"
        articleCount:
          type: "integer"
          format: "int32"
        children:
          type: "array"
          items:
            $ref: "#/components/schemas/CategoryTreeDTO"

    CategoryStatDTO:
      type: "object"
      properties:
        categoryName:
          type: "string"
        articleCount:
          type: "integer"
          format: "int64"
        percentage:
          type: "number"
          format: "double"

    # ==================== 评论模块 ====================
    CommentCreateRequest:
      type: "object"
      required: [ "content" ]
      properties:
        content:
          type: "string"
          minLength: 1
          maxLength: 500
          description: "评论内容"
        parentCommentId:
          type: "integer"
          format: "int64"
          description: "如果是回复，填父评论ID"

    CommentDTO:
      allOf:
        - $ref: "#/components/schemas/BaseDTO"
        - type: "object"
          properties:
            content:
              type: "string"
            commenter:
              $ref: "#/components/schemas/UserProfileDTO"
            articleId:
              type: "integer"
              format: "int64"
            parentCommentId:
              type: "integer"
              format: "int64"
              nullable: true
            replyCount:
              type: "integer"
              format: "int32"
            replies:
              type: "array"
              items:
                $ref: "#/components/schemas/CommentDTO"
              description: "回复列表（懒加载）"
            likeCount:
              type: "integer"
              format: "int32"
            isLiked:
              type: "boolean"

    CommentReplyDTO:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        content:
          type: "string"
        commenter:
          $ref: "#/components/schemas/UserProfileDTO"
        replyToUser:
          $ref: "#/components/schemas/UserProfileDTO"
          description: "回复给谁"
        createdAt:
          type: "string"
          format: "date-time"

    CommentBatchApprovalRequest:
      type: "object"
      required: [ "ids", "approved" ]
      properties:
        ids:
          type: "array"
          items:
            type: "integer"
            format: "int64"
          description: "评论ID列表"
        approved:
          type: "boolean"
          description: "审核状态：true=通过，false=不通过"

    # ==================== 看板统计 ====================
    DashboardStatsDTO:
      type: "object"
      properties:
        userStats:
          $ref: "#/components/schemas/UserStats"
        articleStats:
          $ref: "#/components/schemas/ArticleStats"
        commentStats:
          $ref: "#/components/schemas/CommentStats"
        additionalMetrics:
          type: "object"
          additionalProperties:
            type: "object"

    UserStats:
      type: "object"
      properties:
        totalUsers:
          type: "integer"
          format: "int64"
        activeUsers:
          type: "integer"
          format: "int64"
        newUsersToday:
          type: "integer"
          format: "int64"
        newUsersThisMonth:
          type: "integer"
          format: "int64"

    ArticleStats:
      type: "object"
      properties:
        totalArticles:
          type: "integer"
          format: "int64"
        publishedArticles:
          type: "integer"
          format: "int64"
        draftArticles:
          type: "integer"
          format: "int64"
        totalViews:
          type: "integer"
          format: "int64"
        totalLikes:
          type: "integer"
          format: "int64"

    CommentStats:
      type: "object"
      properties:
        totalComments:
          type: "integer"
          format: "int64"
        pendingComments:
          type: "integer"
          format: "int64"
        approvedComments:
          type: "integer"
          format: "int64"
