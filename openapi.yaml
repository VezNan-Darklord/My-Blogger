openapi: "3.0.3"
info:
  title: "个人博客系统 API 文档"
  description: "基于 Spring Boot 3.2.5 构建的个人博客系统 RESTful API"
  version: "1.0.0"
  contact:
    name: "林子诚"
    email: "941435991@qq.com"
  license:
    name: "Apache 2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0.html"

servers:
  - url: "http://localhost:8080"
    description: "本地开发环境"

paths:
  # ==================== 用户模块 ====================
  /api/users/register:
    post:
      tags:
        - "用户管理"
      summary: "用户注册"
      operationId: "registerUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterRequest"
      responses:
        "200":
          description: "注册成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/UserDetailDTO"

  /api/users/login:
    post:
      tags:
        - "用户管理"
      summary: "用户登录（返回Token）"
      operationId: "loginUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginRequest"
      responses:
        "200":
          description: "登录成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/LoginResponseDTO"

  /api/users/refresh:
    post:
      tags:
        - "用户管理"
      summary: "刷新Token"
      operationId: "refreshToken"
      parameters:
        - name: "refreshToken"
          in: "query"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Token刷新成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/LoginResponseDTO"

  /api/users/{userId}:
    get:
      tags:
        - "用户管理"
      summary: "获取用户详情（通过ID）"
      operationId: "getUserDetail"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/UserDetailDTO"
    put:
      tags:
        - "用户管理"
      summary: "更新用户信息"
      operationId: "updateUser"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: "更新成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/UserDetailDTO"
    delete:
      tags:
        - "用户管理"
      summary: "删除用户（管理员功能）"
      operationId: "deleteUser"
      security:
        - BearerAuth: [ "ROLE_ADMIN" ]
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "softDelete"
          in: "query"
          required: false
          schema:
            type: "boolean"
            default: true
      responses:
        "200":
          description: "操作成功"

  /api/users/username/{username}:
    get:
      tags:
        - "用户管理"
      summary: "获取用户详情（通过用户名）"
      operationId: "getUserDetailByUsername"
      parameters:
        - name: "username"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/UserDetailDTO"

  /api/users/{userId}/profile:
    get:
      tags:
        - "用户管理"
      summary: "获取用户公开资料"
      operationId: "getUserProfile"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/UserProfileDTO"

  /api/users/{userId}/change-password:
    post:
      tags:
        - "用户管理"
      summary: "修改密码"
      operationId: "changePassword"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPasswordChangeRequest"
      responses:
        "200":
          description: "密码修改成功"

  /api/users/{userId}/activity:
    get:
      tags:
        - "用户管理"
      summary: "获取用户活动统计"
      operationId: "getUserActivity"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/UserActivityDTO"

  /api/users:
    get:
      tags:
        - "用户管理"
      summary: "获取所有用户（分页）"
      operationId: "getAllUsers"
      parameters:
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 10
        - name: "sortBy"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "createdAt"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PageResponseDTO_UserProfileDTO"

  /api/users/search:
    get:
      tags:
        - "用户管理"
      summary: "搜索用户"
      operationId: "searchUsers"
      parameters:
        - name: "keyword"
          in: "query"
          required: true
          schema:
            type: "string"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 10
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PageResponseDTO_UserProfileDTO"

  /api/users/{userId}/activate:
    post:
      tags:
        - "用户管理"
      summary: "启用用户（管理员功能）"
      operationId: "activateUser"
      security:
        - BearerAuth: [ "ROLE_ADMIN" ]
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "用户已启用"

  /api/users/{userId}/deactivate:
    post:
      tags:
        - "用户管理"
      summary: "禁用用户（管理员功能）"
      operationId: "deactivateUser"
      security:
        - BearerAuth: [ "ROLE_ADMIN" ]
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "用户已禁用"

  /api/users/{userId}/lock:
    post:
      tags:
        - "用户管理"
      summary: "锁定用户（管理员功能）"
      operationId: "lockUser"
      security:
        - BearerAuth: [ "ROLE_ADMIN" ]
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "用户已锁定"

  /api/users/{userId}/unlock:
    post:
      tags:
        - "用户管理"
      summary: "解锁用户（管理员功能）"
      operationId: "unlockUser"
      security:
        - BearerAuth: [ "ROLE_ADMIN" ]
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "用户已解锁"

  /api/users/stats/active:
    get:
      tags:
        - "用户管理"
      summary: "获取活跃用户数"
      operationId: "countActiveUsers"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        type: "integer"
                        format: "int64"

  /api/users/stats/total:
    get:
      tags:
        - "用户管理"
      summary: "获取总用户数"
      operationId: "getTotalUserCount"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        type: "integer"
                        format: "int64"

  /api/users/stats/recently-active:
    get:
      tags:
        - "用户管理"
      summary: "获取最近活跃用户列表"
      operationId: "getRecentlyActiveUsers"
      parameters:
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 10
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        type: "array"
                        items:
                          $ref: "#/components/schemas/UserActivityDTO"

  # ==================== 文章模块 ====================
  /api/articles:
    post:
      tags:
        - "文章管理"
      summary: "创建文章"
      description: "需要登录，自动使用当前用户作为作者"
      operationId: "createArticle"
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreateRequest"
      responses:
        "200":
          description: "文章创建成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ArticleDetailDTO"
    get:
      tags:
        - "文章管理"
      summary: "获取文章列表"
      description: "公开访问，支持分页"
      operationId: "getArticleList"
      parameters:
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 10
        - name: "sortBy"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "sortDirection"
          in: "query"
          required: false
          schema:
            type: "string"
            enum: [ "asc", "desc", "ASC", "DESC" ]
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PageResponseDTO_ArticleListItemDTO"

  /api/articles/{articleId}:
    put:
      tags:
        - "文章管理"
      summary: "更新文章"
      description: "需要登录且为文章作者或管理员"
      operationId: "updateArticle"
      security:
        - BearerAuth: [ ]
      parameters:
        - name: "articleId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdateRequest"
      responses:
        "200":
          description: "文章更新成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ArticleDetailDTO"
    get:
      tags:
        - "文章管理"
      summary: "获取文章详情"
      description: "公开访问"
      operationId: "getArticleById"
      parameters:
        - name: "articleId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ArticleDetailDTO"
    delete:
      tags:
        - "文章管理"
      summary: "删除文章"
      description: "需要登录且为文章作者或管理员"
      operationId: "deleteArticle"
      security:
        - BearerAuth: [ ]
      parameters:
        - name: "articleId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "文章删除成功"

  /api/articles/{articleId}/publish:
    post:
      tags:
        - "文章管理"
      summary: "发布文章"
      description: "需要登录且为文章作者或管理员"
      operationId: "publishArticle"
      security:
        - BearerAuth: [ ]
      parameters:
        - name: "articleId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "文章发布成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ArticleDetailDTO"

  /api/articles/{articleId}/archive:
    post:
      tags:
        - "文章管理"
      summary: "归档文章"
      description: "需要登录且为文章作者或管理员"
      operationId: "archiveArticle"
      security:
        - BearerAuth: [ ]
      parameters:
        - name: "articleId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "文章归档成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/ArticleDetailDTO"

  /api/articles/{articleId}/like:
    post:
      tags:
        - "文章管理"
      summary: "点赞文章"
      description: "需要登录"
      operationId: "likeArticle"
      security:
        - BearerAuth: [ ]
      parameters:
        - name: "articleId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "点赞成功"

  /api/articles/{articleId}/view:
    post:
      tags:
        - "文章管理"
      summary: "浏览文章"
      description: "公开访问，记录浏览数"
      operationId: "viewArticle"
      parameters:
        - name: "articleId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "记录浏览成功"

  /api/articles/author/{authorId}:
    get:
      tags:
        - "文章管理"
      summary: "获取作者的文章列表"
      description: "公开访问"
      operationId: "getArticlesByAuthor"
      parameters:
        - name: "authorId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 10
        - name: "sortBy"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "sortDirection"
          in: "query"
          required: false
          schema:
            type: "string"
            enum: [ "asc", "desc", "ASC", "DESC" ]
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PageResponseDTO_ArticleListItemDTO"

  /api/articles/search:
    get:
      tags:
        - "文章管理"
      summary: "搜索文章"
      description: "公开访问"
      operationId: "searchArticles"
      parameters:
        - name: "keyword"
          in: "query"
          required: true
          schema:
            type: "string"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 10
        - name: "sortBy"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "sortDirection"
          in: "query"
          required: false
          schema:
            type: "string"
            enum: [ "asc", "desc", "ASC", "DESC" ]
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PageResponseDTO_ArticleListItemDTO"

  /api/articles/batch/publish:
    post:
      tags:
        - "文章管理"
      summary: "批量发布文章"
      description: "需要管理员权限"
      operationId: "batchPublishArticles"
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchIdRequest"
      responses:
        "200":
          description: "批量发布成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        type: "integer"

  /api/articles/batch/archive:
    post:
      tags:
        - "文章管理"
      summary: "批量归档文章"
      description: "需要管理员权限"
      operationId: "batchArchiveArticles"
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchIdRequest"
      responses:
        "200":
          description: "批量归档成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        type: "integer"

  /api/articles/batch/delete:
    post:
      tags:
        - "文章管理"
      summary: "批量删除文章"
      description: "需要管理员权限"
      operationId: "batchDeleteArticles"
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchIdRequest"
      responses:
        "200":
          description: "批量删除成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        type: "integer"

  # ==================== 分类模块 ====================
  /api/categories:
    post:
      tags:
        - "分类管理"
      summary: "创建分类"
      operationId: "createCategory"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "200":
          description: "分类创建成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/CategoryDTO"
    get:
      tags:
        - "分类管理"
      summary: "获取所有分类（分页）"
      operationId: "getAllCategories"
      parameters:
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 10
        - name: "sortBy"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "createdAt"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/PageResponseDTO_CategoryDTO"

  /api/categories/{categoryId}:
    put:
      tags:
        - "分类管理"
      summary: "更新分类"
      operationId: "updateCategory"
      parameters:
        - name: "categoryId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "200":
          description: "分类更新成功"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Result"
                  - properties:
                      data:
                        $ref: "#/components/schemas/CategoryDTO"
    get:
      tags:
        - "分类管理"
      summary: "获取分类详情（通过ID）"
      operationId: "getCategoryById"
      parameters:
        - name: "categoryId"
          in: "path"
          required: true
          schema:
            type: "integer"
